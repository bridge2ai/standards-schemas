# Main workflow

name: Build and test standards-schemas

on: [pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:

      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      #----------------------------------------------
      #          install & configure poetry
      #----------------------------------------------
      - name: Install Poetry
        # Installing via pip rather than snok/install-poetry@v1, which pulls the
        # latest Poetry (2.4.x, requiring Python >= 3.10) and so cannot install
        # under the 3.9 matrix entry. pip resolves a version compatible with
        # whichever Python is set up. This matches b2ai-standards-registry.
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      #----------------------------------------------
      #    install your root project, if required
      #----------------------------------------------
      - name: Install library
        run: poetry install --no-interaction

      #----------------------------------------------
      #    Run LinkML example validation
      #----------------------------------------------
      - name: Run LinkML example validation
        run: make combined-extras